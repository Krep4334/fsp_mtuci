name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tournament
          POSTGRES_PASSWORD: tournament
          POSTGRES_DB: tournament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tournament -d tournament_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: test
      DISABLE_OBJECT_STORAGE: "true"
      JWT_SECRET: "test-jwt-secret"
      DATABASE_URL: "postgresql://tournament:tournament@localhost:5432/tournament_test"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test
      - run: npm run test:integration

  client-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tournament
          POSTGRES_PASSWORD: tournament
          POSTGRES_DB: tournament_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tournament -d tournament_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: production
      DISABLE_OBJECT_STORAGE: "true"
      JWT_SECRET: "test-jwt-secret"
      DATABASE_URL: "postgresql://tournament:tournament@localhost:5432/tournament_test"
      PORT: "3001"
      CLIENT_URL: "http://localhost:3001"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run build
        working-directory: client
      - run: npm run build
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Run server + Playwright
        run: |
          npm start &
          SERVER_PID=$!
          for i in {1..60}; do
            if curl -sSf http://localhost:3001/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sSf -X POST http://localhost:3001/api/debug/create-admin -H "Content-Type: application/json" || true

          cd client
          npx playwright test
          cd ..

          kill $SERVER_PID
