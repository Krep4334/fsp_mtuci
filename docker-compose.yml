services:
  # Локальный S3 для разработки: API :9000, веб-консоль :9001
  # Запуск только MinIO: docker compose up -d minio
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament
      POSTGRES_DB: tournament
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tournament -d tournament']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_SITE_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://tournament:tournament@db:5432/tournament
      NODE_ENV: production
      PORT: '3001'
      CLIENT_URL: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
